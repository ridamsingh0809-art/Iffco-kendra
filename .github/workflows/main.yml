
name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/iffcokendra/app app/src/main/assets
          mv app_build.gradle app/build.gradle
          mv MainActivity.java app/src/main/java/com/iffcokendra/app/
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" |
