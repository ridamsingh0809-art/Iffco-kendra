plugins {
    id 'com.android.application'
}

def ksPath = System.getenv('KEYSTORE_PATH')
def ksPass = System.getenv('KEY_PASSWORD')

android {
    namespace 'com.iffcokendra.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.iffcokendra.app'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '3.0'
    }

    signingConfigs {
        release {
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias 'iffco'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
